name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        # Matches the version pinned in Gemfile and mise.toml
        ruby-version: '4.0.6'
        bundler-cache: true

    # The extraction tests parse saved markup in a real browser. Without this
    # they skip, so install the same driver version the gem expects.
    - name: Install Playwright browser
      run: |
        # bundle exec: with bundler-cache the gems live in vendor/bundle, so a
        # bare `ruby -e` cannot require the gem and the version comes back empty.
        VERSION=$(bundle exec ruby -e 'require "playwright"; print Playwright::COMPATIBLE_PLAYWRIGHT_VERSION')
        test -n "$VERSION" || { echo "Could not resolve Playwright version"; exit 1; }
        echo "Installing Playwright driver $VERSION to match the gem"
        npm install -g "playwright@${VERSION}"
        playwright install --with-deps chromium
        # A mismatched driver makes the extraction tests skip rather than fail,
        # which would quietly drop that coverage; fail the build instead.
        playwright --version | grep -q "$VERSION" || {
          echo "Driver version mismatch: expected $VERSION, got $(playwright --version)"
          exit 1
        }

    - name: Run tests
      run: bundle exec rake test

    - name: Run StandardRB
      run: bundle exec standardrb

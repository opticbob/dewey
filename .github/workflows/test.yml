name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        # Matches the version pinned in Gemfile and mise.toml
        ruby-version: '3.4.8'
        bundler-cache: true

    # The extraction tests parse saved markup in a real browser. Without this
    # they skip, so install the same driver version the gem expects.
    - name: Install Playwright browser
      run: |
        npm install -g playwright@$(ruby -e 'require "playwright"; print Playwright::COMPATIBLE_PLAYWRIGHT_VERSION')
        playwright install --with-deps chromium

    - name: Run tests
      run: bundle exec rake test

    - name: Run StandardRB
      run: bundle exec standardrb

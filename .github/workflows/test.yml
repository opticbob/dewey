name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        # Matches the version pinned in Gemfile and mise.toml
        ruby-version: '3.4.8'
        bundler-cache: true

    - name: Run tests
      run: bundle exec rake test

    - name: Run StandardRB
      run: bundle exec standardrb
